name: Feature or improvement
description: Suggest a focused product, accessibility, or reproducibility improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user flow or research improvement and any alternatives.
    validations:
      required: true
